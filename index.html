<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kappa House · Laundry</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand key-brand" href="./" aria-label="Kappa laundry home"><img src="assets/kappa-emblem.png" width="54" height="54" alt="Kappa fleur-de-lis and golden key"></a><nav aria-label="Main navigation"><button id="nav-tracker" aria-pressed="false">Laundry Tracker</button><button id="nav-availability" aria-pressed="true">Laundry Availability</button></nav><span class="address">325 Waldron St</span></header><main><section class="toolbar"><div><h1 id="view-title">Machine availability</h1></div><label>Show <select id="filter"><option value="all">All machines</option><option value="washer">Washers</option><option value="dryer">Dryers</option></select></label></section><div id="summary" class="summary" aria-live="polite"></div><p id="copy-feedback" class="copy-feedback" role="status" aria-live="polite"></p><div id="rooms"></div><aside id="connection" role="status">Connecting…</aside></main>
<dialog id="checkin"><form id="cycle"><button type="button" class="close" aria-label="Close">×</button><p class="eyebrow" id="machine-room"></p><h2 id="machine-title"></h2><p id="machine-status"></p><div id="dialog-timer"></div><div id="start-fields"><label>Find your name<input id="resident-search" type="search" autocomplete="off" placeholder="Search the house roster…" aria-controls="resident"><span class="input-hint">Search, then choose your name below.</span></label><label>Resident<select id="resident" required><option value="">Choose your name</option></select></label><p id="roster-note" class="note"></p><label>Cycle length<select id="minutes"><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60">60 minutes</option><option value="75">75 minutes</option><option value="90">90 minutes</option></select></label></div><p id="form-error" role="alert"></p><button id="submit" class="primary">Start my cycle</button><button id="finish" type="button" class="primary">I’ve emptied this machine</button><button id="contact" type="button" class="primary" hidden>Copy phone number</button><p id="dialog-feedback" class="copy-feedback" role="status" aria-live="polite"></p><p id="contact-note" class="note" hidden>A phone number hasn’t been added for this resident.</p><button id="copy" type="button" class="secondary">Copy machine QR link</button><p class="note">Your selected name will appear with this cycle. Please only select yourself. The contact button copies the resident’s phone number to your clipboard.</p></form></dialog><script src="config.js"></script><script type="module" src="app.js"></script></body></html>
