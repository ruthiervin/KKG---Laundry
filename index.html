<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kappa House · Laundry</title><link rel="stylesheet" href="style.css?v=3"></head>
<body><header><a class="brand key-brand" href="./" aria-label="Kappa laundry home"><img src="kappa-emblem.png" width="54" height="54" alt="Kappa fleur-de-lis and golden key"></a><nav aria-label="Main navigation"><button id="nav-tracker" aria-pressed="false">Use a machine</button><button id="nav-availability" aria-pressed="true">Laundry Availability</button></nav><span class="address">325 Waldron St</span></header><main><section class="toolbar"><div><h1 id="view-title">Laundry availability</h1></div><label>Show <select id="filter"><option value="all">All machines</option><option value="washer">Washers</option><option value="dryer">Dryers</option></select></label></section><div id="summary" class="summary" aria-live="polite"></div><p id="copy-feedback" class="copy-feedback" role="status" aria-live="polite"></p><div id="rooms"></div><aside id="connection" role="status">Connecting…</aside></main>
<dialog id="checkin"><form id="cycle"><button type="button" class="close" aria-label="Close">×</button><p class="eyebrow" id="machine-room"></p><h2 id="machine-title"></h2><p id="machine-status"></p><div id="dialog-timer"></div><div id="start-fields"><label>Find your name<input id="resident-search" type="search" autocomplete="off" placeholder="Search the house roster…" aria-controls="resident"></label><label>Resident<select id="resident" required><option value="">Choose your name</option></select></label><p id="roster-note" class="note"></p><fieldset id="duration-picker" class="duration-picker">
  <legend>Expected cycle time</legend>
  <div class="duration-labels" aria-hidden="true"><span>Hours</span><span>Minutes</span></div>
  <div class="duration-wheels">
    <div class="picker-selection" aria-hidden="true"></div>
    <div id="duration-hours" class="time-wheel" role="spinbutton" tabindex="0"
         aria-label="Hours" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0"></div>
    <div id="duration-minutes" class="time-wheel" role="spinbutton" tabindex="0"
         aria-label="Minutes" aria-valuemin="0" aria-valuemax="59" aria-valuenow="30"></div>
  </div>
  <output id="duration-value" class="duration-value">30 minutes</output>
</fieldset></div><p id="form-error" role="alert"></p><button id="submit" class="primary">Start my cycle</button><button id="finish" type="button" class="primary">I’ve emptied this machine</button><button id="contact" type="button" class="primary" hidden>Copy phone number</button><p id="dialog-feedback" class="copy-feedback" role="status" aria-live="polite"></p><p id="contact-note" class="note" hidden>A phone number hasn’t been added for this resident.</p><button id="copy" type="button" class="secondary">Copy machine QR link</button><p class="note">Please select your own name.</p></form></dialog><script src="config.js"></script><script type="module" src="app.js?v=3"></script></body></html>
